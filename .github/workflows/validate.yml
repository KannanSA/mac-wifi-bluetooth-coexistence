name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh status.sh
      - name: Validate launch daemon
        run: plutil -lint launchd/com.github.kannansa.wifi-bluetooth-coexistence.plist
      - name: Run non-privileged status check
        run: ./status.sh
